name: Build nOS Lite ISO

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            grub-pc-bin \
            grub-common \
            grub-efi-amd64-bin \
            grub-efi-amd64 \
            xorriso \
            mtools

      - name: Prepare ISO
        run: |
          rm -rf iso
          mkdir -p iso/boot/grub
          mkdir -p iso/nOS-Lite

          find . -maxdepth 1 -type f \
            ! -name "nOS-Lite.iso" \
            -exec cp {} iso/nOS-Lite/ \;

      - name: GRUB config
        run: |
          cat > iso/boot/grub/grub.cfg <<'EOF'
          set timeout=3
          set default=0

          menuentry "nOS Lite" {
              echo "Starting nOS Lite..."
          }
          EOF

      - name: Build Legacy BIOS ISO
        run: |
          grub-mkrescue \
            --modules="biosdisk iso9660" \
            -o nOS-Lite.iso \
            iso

      - name: Verify
        run: |
          file nOS-Lite.iso
          ls -lh nOS-Lite.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nOS-Lite-ISO
          path: nOS-Lite.iso
