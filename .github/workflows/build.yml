name: Build nOS Lite ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nOS Lite
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build nOS Lite
        run: npm run build

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            grub-pc-bin \
            grub-common \
            grub-efi-amd64-bin \
            xorriso \
            mtools

      - name: Prepare ISO
        run: |
          rm -rf iso
          mkdir -p iso/boot/grub
          mkdir -p iso/nOS-Lite
          cp -r dist/* iso/nOS-Lite/

      - name: Create GRUB configuration
        run: |
          cat > iso/boot/grub/grub.cfg <<'EOF'
          set timeout=5
          set default=0

          menuentry "nOS Lite" {
              echo "Starting nOS Lite..."
          }
          EOF

      - name: Build BIOS ISO
        run: |
          grub-mkrescue \
            -d /usr/lib/grub/i386-pc \
            -o nOS-Lite.iso \
            iso

      - name: Check ISO
        run: |
          ls -lh nOS-Lite.iso
          xorriso -indev nOS-Lite.iso -report_el_torito plain

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: nOS-Lite-ISO
          path: nOS-Lite.iso
