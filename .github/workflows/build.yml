name: Build nOS Lite ISO

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nOS Lite
        uses: actions/checkout@v4

      - name: Install ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-efi-amd64-bin xorriso

      - name: Prepare ISO
        run: |
          mkdir -p iso/boot/grub
          cp -r . iso/nOS-Lite

      - name: Create GRUB configuration
        run: |
          cat > iso/boot/grub/grub.cfg <<'EOF'
          set timeout=0
          set default=0

          menuentry "nOS Lite" {
              echo "Starting nOS Lite..."
          }
          EOF

      - name: Build ISO
        run: |
          grub-mkrescue -o nOS-Lite.iso iso

      - name: Upload nOS Lite ISO
        uses: actions/upload-artifact@v4
        with:
          name: nOS-Lite-ISO
          path: nOS-Lite.iso
