name: Build nOS Lite

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build nOS Lite
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: nOS-Lite-web
          path: dist/
