name: Build nOS Lite ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout nOS Lite
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build nOS Lite web
        run: |
          npm install
          npm run build

      - name: Install OS development tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            gcc-multilib \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools

      - name: Compile nOS Lite kernel
        run: |
          gcc -m32 \
            -ffreestanding \
            -fno-pie \
            -fno-stack-protector \
            -nostdlib \
            -nodefaultlibs \
            -c kernel.c \
            -o kernel.o

          as --32 boot.s -o boot.o

          ld -m elf_i386 \
            -T linker.ld \
            -o kernel.bin \
            boot.o kernel.o

      - name: Prepare ISO
        run: |
          rm -rf iso
          mkdir -p iso/boot/grub
          mkdir -p iso/nOS-Lite

          cp kernel.bin iso/boot/kernel.bin
          cp -r dist/* iso/nOS-Lite/

      - name: Create GRUB configuration
        run: |
          cat > iso/boot/grub/grub.cfg <<'EOF'
          set timeout=5
          set default=0

          menuentry "nOS Lite" {
              multiboot /boot/kernel.bin
              boot
          }
          EOF

      - name: Build BIOS ISO
        run: |
          grub-mkrescue \
            -o nOS-Lite.iso \
            iso

      - name: Verify files
        run: |
          file kernel.bin
          ls -lh kernel.bin
          ls -lh nOS-Lite.iso

      - name: Upload nOS Lite ISO
        uses: actions/upload-artifact@v4
        with:
          name: nOS-Lite-ISO
          path: nOS-Lite.iso
